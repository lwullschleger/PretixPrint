<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gate Print Service</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Gate Print Service</h1>

  <section>
    <label>Printer:</label>
    <select id="printerSelect"></select>
    <button id="testPrintBtn">Test Print</button>
  </section>

  <section>
    <label>
      <input type="checkbox" id="autoPrintToggle" checked>
      Auto-print on check-in
    </label>
  </section>

  <section>
    <h2>Print Log</h2>
    <table id="logTable">
      <thead>
        <tr><th>#</th><th>Order</th><th>Position</th><th>Timestamp</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="renderer.js"></script>
</body>
</html>
